<!DOCTYPE html>
<html lang="bn">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sadik Sir 2 — Audio Player & Transcript Tracker</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600&family=Hind+Siliguri:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #090d14;
            --surface: #111824;
            --surface-hover: #172131;
            --border: #1e2b3e;
            --text-main: #f3f4f6;
            --text-muted: #94a3b8;
            --accent: #38bdf8;
            --accent-glow: rgba(56, 189, 248, 0.25);
            --flex-color: #f59e0b;
            --flex-bg: rgba(245, 158, 11, 0.08);
            --flex-border: rgba(245, 158, 11, 0.4);
            --manip-color: #ec4899;
            --manip-bg: rgba(236, 72, 153, 0.08);
            --manip-border: rgba(236, 72, 153, 0.4);
            --active-bg: rgba(56, 189, 248, 0.12);
            --active-border: #38bdf8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Inter', 'Hind Siliguri', system-ui, sans-serif;
            background: var(--bg);
            color: var(--text-main);
            min-height: 100vh;
            padding: 8px 10px 60px 10px;
            line-height: 1.5;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        /* STICKY CUSTOM PLAYER DOCK */
        .player-dock {
            position: sticky;
            top: 4px;
            z-index: 100;
            background: rgba(15, 23, 36, 0.96);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 10px 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5), 0 0 16px rgba(56, 189, 248, 0.08);
            margin-bottom: 10px;
        }

        /* Top Status Line */
        .player-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            margin-bottom: 6px;
        }

        .current-status {
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 6px;
            min-width: 0;
            flex: 1;
        }

        .status-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #10b981;
            box-shadow: 0 0 8px #10b981;
            flex-shrink: 0;
        }

        .status-text {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            color: var(--text-muted);
            font-size: 0.78rem;
        }

        .player-top-right {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-shrink: 0;
        }

        .btn-speed {
            font-family: 'Fira Code', monospace;
            color: var(--accent);
            background: var(--surface);
            border: 1px solid var(--border);
            padding: 3px 8px;
            border-radius: 6px;
            font-size: 0.72rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.15s ease;
        }

        .btn-speed:hover {
            border-color: var(--accent);
        }

        .mute-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            padding: 2px 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: color 0.15s ease;
        }

        .mute-btn:hover {
            color: var(--text-main);
        }

        .mute-btn svg {
            width: 17px;
            height: 17px;
        }

        /* Scrubber Timeline Line */
        .custom-scrubber-line {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(9, 13, 20, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 8px;
            padding: 5px 8px;
            margin-bottom: 8px;
        }

        .time-label {
            font-family: 'Fira Code', monospace;
            font-size: 0.74rem;
            color: var(--text-muted);
            flex-shrink: 0;
            min-width: 40px;
        }

        .time-label.current {
            color: var(--accent);
            text-align: right;
        }

        .progress-wrap {
            flex: 1;
            position: relative;
            display: flex;
            align-items: center;
        }

        .custom-range {
            -webkit-appearance: none;
            appearance: none;
            width: 100%;
            height: 5px;
            border-radius: 999px;
            background: linear-gradient(to right, var(--accent) 0%, var(--accent) var(--progress, 0%), #1e2b3e var(--progress, 0%), #1e2b3e 100%);
            outline: none;
            cursor: pointer;
            transition: height 0.15s ease;
        }

        .custom-range:hover {
            height: 7px;
        }

        .custom-range::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 13px;
            height: 13px;
            border-radius: 50%;
            background: #ffffff;
            cursor: pointer;
            box-shadow: 0 0 8px var(--accent);
            transition: transform 0.15s ease;
        }

        .custom-range::-webkit-slider-thumb:hover {
            transform: scale(1.25);
        }

        .custom-range::-moz-range-thumb {
            width: 13px;
            height: 13px;
            border-radius: 50%;
            background: #ffffff;
            border: none;
            cursor: pointer;
            box-shadow: 0 0 8px var(--accent);
            transition: transform 0.15s ease;
        }

        /* Dedicated Playback Controls Row: Prev, Play/Pause, Next */
        .playback-controls-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            padding: 2px 0;
        }

        .nav-control-btn {
            background: var(--surface);
            border: 1px solid var(--border);
            color: var(--flex-color);
            padding: 5px 12px;
            border-radius: 8px;
            font-size: 0.76rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.15s ease;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            user-select: none;
        }

        .nav-control-btn:hover {
            background: var(--flex-bg);
            border-color: var(--flex-color);
            transform: translateY(-1px);
        }

        .nav-control-btn svg {
            width: 13px;
            height: 13px;
        }

        .play-btn {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: var(--accent);
            border: none;
            color: #0b111a;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            flex-shrink: 0;
            transition: transform 0.15s ease, box-shadow 0.15s ease;
            box-shadow: 0 0 12px var(--accent-glow);
        }

        .play-btn:hover {
            transform: scale(1.08);
        }

        .play-btn svg {
            width: 17px;
            height: 17px;
        }

        /* CONTROLS BAR: 3 TABS + SEARCH */
        .toolbar {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 10px;
        }

        /* 3 Tabs: ALWAYS ONE LINE NO MATTER WHAT */
        .filter-tabs {
            display: flex !important;
            flex-wrap: nowrap !important;
            gap: 6px;
            width: 100%;
        }

        .filter-btn {
            flex: 1 1 0;
            min-width: 0;
            background: var(--surface);
            border: 1px solid var(--border);
            color: var(--text-muted);
            padding: 7px 4px;
            border-radius: 8px;
            font-size: 0.78rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.15s ease;
            white-space: nowrap !important;
            overflow: hidden !important;
            text-overflow: ellipsis !important;
            text-align: center;
        }

        .filter-btn:hover {
            color: var(--text-main);
            border-color: #3b4d66;
        }

        .filter-btn.active {
            color: var(--accent);
            border-color: var(--accent);
            background: rgba(56, 189, 248, 0.08);
        }

        .filter-btn.active.flex-tab {
            color: var(--flex-color);
            border-color: var(--flex-color);
            background: var(--flex-bg);
        }

        .filter-btn.active.manip-tab {
            color: var(--manip-color);
            border-color: var(--manip-color);
            background: var(--manip-bg);
        }

        .search-input {
            width: 100%;
            background: var(--surface);
            border: 1px solid var(--border);
            color: var(--text-main);
            padding: 7px 12px;
            border-radius: 8px;
            font-size: 0.82rem;
            outline: none;
            transition: border-color 0.15s ease;
        }

        .search-input:focus {
            border-color: var(--accent);
        }

        /* TRANSCRIPT LIST */
        .transcript-list {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        /* Single Unified Mobile-First Feed (No Double Card Look) */
        .transcript-row {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 8px 10px;
            cursor: pointer;
            transition: background 0.15s ease, border-color 0.15s ease;
            position: relative;
        }

        .transcript-row:hover {
            background: var(--surface-hover);
            border-color: #2e3e55;
        }

        .transcript-row.active {
            background: var(--active-bg) !important;
            border-color: var(--active-border) !important;
            box-shadow: 0 0 10px rgba(56, 189, 248, 0.16);
        }

        .transcript-row.is-flex {
            border-left: 3px solid var(--flex-color);
            background: linear-gradient(90deg, rgba(245, 158, 11, 0.07) 0%, var(--surface) 100%);
        }

        .transcript-row.is-manip {
            border-left: 3px solid var(--manip-color);
            background: linear-gradient(90deg, rgba(236, 72, 153, 0.07) 0%, var(--surface) 100%);
        }

        .row-meta {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 6px;
            margin-bottom: 3px;
        }

        .timestamp {
            font-family: 'Fira Code', monospace;
            font-size: 0.72rem;
            color: var(--accent);
            background: rgba(56, 189, 248, 0.08);
            padding: 1px 5px;
            border-radius: 4px;
        }

        .is-flex .timestamp {
            color: var(--flex-color);
            background: rgba(245, 158, 11, 0.12);
        }

        .is-manip .timestamp {
            color: var(--manip-color);
            background: rgba(236, 72, 153, 0.12);
        }

        .speaker-badge {
            font-size: 0.66rem;
            font-weight: 700;
            padding: 1px 5px;
            border-radius: 4px;
        }

        .speaker-teacher {
            background: rgba(99, 102, 241, 0.15);
            color: #818cf8;
        }

        .speaker-student {
            background: rgba(16, 185, 129, 0.15);
            color: #34d399;
        }

        .tag-badge {
            font-size: 0.66rem;
            font-weight: 700;
            padding: 1px 5px;
            border-radius: 4px;
        }

        .tag-flex {
            background: var(--flex-color);
            color: #78350f;
        }

        .tag-manip {
            background: var(--manip-color);
            color: #ffffff;
        }

        .transcript-text {
            font-family: 'Hind Siliguri', 'Inter', sans-serif;
            font-size: 0.92rem;
            color: #f3f4f6;
            line-height: 1.5;
        }

        .tag-title {
            font-size: 0.72rem;
            color: var(--flex-color);
            font-weight: 600;
            margin-top: 3px;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .tag-title.manip-title {
            color: var(--manip-color);
        }

        .empty-state {
            text-align: center;
            padding: 30px 16px;
            color: var(--text-muted);
            background: var(--surface);
            border: 1px dashed var(--border);
            border-radius: 8px;
            font-size: 0.85rem;
        }

        /* Mobile specific refinements */
        @media (max-width: 640px) {
            body {
                padding: 4px 6px 50px 6px;
            }

            .player-dock {
                padding: 8px 10px;
                margin-bottom: 8px;
            }

            .playback-controls-row {
                gap: 14px;
            }

            .nav-control-btn {
                padding: 4px 10px;
                font-size: 0.72rem;
            }

            .play-btn {
                width: 34px;
                height: 34px;
            }

            .filter-btn {
                font-size: 0.74rem;
                padding: 6px 2px;
            }

            /* Borderless unified feed on mobile: eliminates double-card look completely */
            .transcript-list {
                gap: 0;
                background: var(--surface);
                border: 1px solid var(--border);
                border-radius: 8px;
                overflow: hidden;
            }

            .transcript-row {
                background: transparent;
                border: none;
                border-bottom: 1px solid rgba(255, 255, 255, 0.05);
                border-radius: 0;
                padding: 8px 9px;
            }

            .transcript-row:last-child {
                border-bottom: none;
            }

            .transcript-row.is-flex {
                border-left: 3px solid var(--flex-color);
                background: rgba(245, 158, 11, 0.06);
            }

            .transcript-row.is-manip {
                border-left: 3px solid var(--manip-color);
                background: rgba(236, 72, 153, 0.06);
            }

            .transcript-row.active {
                background: rgba(56, 189, 248, 0.14) !important;
                border-left: 3px solid var(--accent) !important;
            }

            .transcript-text {
                font-size: 0.88rem;
            }
        }
    </style>
    <!-- Loads seamlessly on GitHub Pages AND local file:/// without CORS restrictions -->
    <script src="transcript.js"></script>
</head>

<body>

    <div class="container">
        <!-- STICKY CUSTOM PLAYER DOCK -->
        <div class="player-dock">
            <!-- Line 1: Status & Secondary Options -->
            <div class="player-top">
                <div class="current-status">
                    <span class="status-dot"></span>
                    <span id="activeLineLabel" class="status-text"></span>
                </div>
                <div class="player-top-right">
                    <button class="btn-speed" id="speedBtn" title="প্লেব্যাক স্পিড">1x</button>
                    <button class="mute-btn" id="muteBtn" aria-label="মিউট / আনমিউট">
                        <svg id="volumeIcon" viewBox="0 0 24 24" fill="currentColor"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
                        <svg id="muteIcon" viewBox="0 0 24 24" fill="currentColor" style="display:none"><path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/></svg>
                    </button>
                </div>
            </div>

            <!-- Line 2: Scrubber Timeline Bar -->
            <div class="custom-scrubber-line">
                <span class="time-label current" id="currentTimeLabel">00:00</span>
                <div class="progress-wrap">
                    <input type="range" id="progressBar" class="custom-range" min="0" max="100" value="0" step="0.1" aria-label="Audio scrubber">
                </div>
                <span class="time-label" id="durationLabel">42:10</span>
            </div>

            <!-- Line 3: Separate Playback Controls (Prev, Play/Pause, Next) -->
            <div class="playback-controls-row">
                <button class="nav-control-btn" id="prevFlexBtn" title="পূর্ববর্তী ফ্লেক্স">
                    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
                    <span>আগেরটা</span>
                </button>

                <button class="play-btn" id="playBtn" aria-label="Play or Pause">
                    <svg id="playIcon" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
                    <svg id="pauseIcon" viewBox="0 0 24 24" fill="currentColor" style="display:none"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
                </button>

                <button class="nav-control-btn" id="nextFlexBtn" title="পরবর্তী ফ্লেক্স">
                    <span>পরেরটা</span>
                    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
                </button>
            </div>

            <!-- Hidden native audio element -->
            <audio id="audio" preload="metadata" src="sadik%20sir%202.mp3"></audio>
        </div>

        <!-- CONTROLS: 3 TABS (ALWAYS ONE LINE) + SEARCH -->
        <div class="toolbar">
            <div class="filter-tabs">
                <button class="filter-btn active" data-filter="all" title="সব লাইন">সব (<span id="countAll">257</span>)</button>
                <button class="filter-btn flex-tab" data-filter="flex" title="ফ্লেক্স">🔥 ফ্লেক্স (<span id="countFlex">9</span>)</button>
                <button class="filter-btn manip-tab" data-filter="manip" title="ম্যানিপুলেশন">🎭 ম্যানিপুলেশন (<span id="countManip">6</span>)</button>
            </div>
            <input type="text" id="searchInput" class="search-input" placeholder="খুঁজুন / Search transcript...">
        </div>

        <!-- TRANSCRIPT LIST -->
        <main class="transcript-list" id="transcriptList">
            <div class="empty-state">লোড হচ্ছে...</div>
        </main>
    </div>

    <script>
        // High-level analysis mapping of all major flexes & psychological manipulation moments
        const labeledMoments = [
            // Major Flexes
            { start: 52.9, end: 80.5, label: "প্রক্সি / মামার একাউন্ট মাল্টি-অ্যাকাউন্টিং ফ্লেক্স", type: "flex" },
            { start: 87.6, end: 126.5, label: "টপ রেটেড সেলার প্রায়োরিটি প্রিভিলেজ ফ্লেক্স", type: "flex" },
            { start: 273.9, end: 299.5, label: "লারাভেল এজেন্সি ও ৩,০০০ কমপ্লিটেড প্রজেক্ট ফ্লেক্স", type: "flex" },
            { start: 299.6, end: 313.5, label: "সফল শিক্ষার্থী ও 'ফাঁকিবাজির প্রমাণ করার নাই'", type: "flex" },
            { start: 366.9, end: 384.5, label: "টাকা নিয়ে অবসাদ ($১০০০ ডলারও জাস্ট একটা পেইন)", type: "flex" },
            { start: 1018.6, end: 1032.5, label: "৪০৫ অর্ডার কমপ্লিটেড একাউন্ট ভ্যালু ফ্লেক্স", type: "flex" },
            { start: 1224.6, end: 1243.5, label: "$৫,০০০ প্যাসিভ ইনকাম (রাত না জাগার ফ্লেক্স)", type: "flex" },
            { start: 1251.6, end: 1303.5, label: "গ্লোবাল ক্লায়েন্ট মনোপলি (৩১% বনাম ৮৫% কভারেজ)", type: "flex" },
            { start: 1403.1, end: 1438.0, label: "লাইভ ক্লাসে মোবাইল অ্যাপে কাজ নামানোর ফ্লেক্স", type: "flex" },

            // Manipulation / Authoritarian / Control Moments
            { start: 227.1, end: 247.5, label: "শিক্ষার্থীদের বুদ্ধিমত্তা নিয়ে তাচ্ছিল্য ও আত্মপ্রশংসা", type: "manip" },
            { start: 323.1, end: 348.0, label: "বকবক শোনা বাধ্যতামূলক করার কর্তৃত্ববাদী ভঙ্গি", type: "manip" },
            { start: 1303.6, end: 1329.5, label: "খাবারের ব্রেক চাওয়ায় শিক্ষার্থীকে খোঁচা ও লজ্জা দেওয়া", type: "manip" },
            { start: 1494.6, end: 1512.5, label: "নির্ভরশীলতা তৈরি: 'বকবক না শুনলে কাজ নামাতে পারবেন না'", type: "manip" },
            { start: 2125.1, end: 2135.5, label: "প্রশ্ন আটকাতে 'মাকে চেনা'র অদ্ভুত তুলনা", type: "manip" },
            { start: 2221.1, end: 2249.5, label: "প্যাটার্নালিস্টিক 'বাবা' বলে কৌতূহল দমন", type: "manip" }
        ];

        let transcriptData = [];
        let currentFilter = 'all';
        let searchQuery = '';
        let flexMoments = [];
        let isScrubbing = false;

        const audio = document.getElementById('audio');
        const playBtn = document.getElementById('playBtn');
        const playIcon = document.getElementById('playIcon');
        const pauseIcon = document.getElementById('pauseIcon');
        const progressBar = document.getElementById('progressBar');
        const currentTimeLabel = document.getElementById('currentTimeLabel');
        const durationLabel = document.getElementById('durationLabel');
        const muteBtn = document.getElementById('muteBtn');
        const volumeIcon = document.getElementById('volumeIcon');
        const muteIcon = document.getElementById('muteIcon');
        const speedBtn = document.getElementById('speedBtn');

        const listEl = document.getElementById('transcriptList');
        const activeLabelEl = document.getElementById('activeLineLabel');
        const searchInput = document.getElementById('searchInput');
        const filterBtns = document.querySelectorAll('.filter-btn');
        const prevFlexBtn = document.getElementById('prevFlexBtn');
        const nextFlexBtn = document.getElementById('nextFlexBtn');

        const speeds = [1, 1.25, 1.5, 2];
        let currentSpeedIdx = 0;

        function formatTime(sec) {
            if (isNaN(sec) || sec < 0) return "00:00";
            const m = Math.floor(sec / 60);
            const s = Math.floor(sec % 60);
            return `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
        }

        // Custom Audio Player Controls
        playBtn.addEventListener('click', () => {
            if (audio.paused) {
                audio.play();
            } else {
                audio.pause();
            }
        });

        audio.addEventListener('play', () => {
            playIcon.style.display = 'none';
            pauseIcon.style.display = 'block';
        });

        audio.addEventListener('pause', () => {
            playIcon.style.display = 'block';
            pauseIcon.style.display = 'none';
        });

        audio.addEventListener('loadedmetadata', () => {
            durationLabel.textContent = formatTime(audio.duration);
        });

        audio.addEventListener('timeupdate', () => {
            if (!isScrubbing) {
                const curr = audio.currentTime;
                const dur = audio.duration || 2530;
                currentTimeLabel.textContent = formatTime(curr);
                
                const pct = dur > 0 ? (curr / dur) * 100 : 0;
                progressBar.value = pct;
                progressBar.style.setProperty('--progress', `${pct}%`);
            }

            // Sync with transcript lines
            const curr = audio.currentTime;
            const active = transcriptData.find(d => curr >= d.start && curr < d.end);
            if (active) {
                let speakerLabel = active.speaker;
                if (active.speaker.toLowerCase() === 'teacher') speakerLabel = 'শিক্ষক';
                else if (active.speaker.toLowerCase() === 'student') speakerLabel = 'শিক্ষার্থী';

                let label = `[${formatTime(active.start)}] ${speakerLabel}`;
                if (active.tagLabel) {
                    label += ` — ${active.tagLabel}`;
                }
                activeLabelEl.textContent = label;

                document.querySelectorAll('.transcript-row').forEach(r => r.classList.remove('active'));
                const activeEl = document.getElementById(`line-${active.id}`);
                if (activeEl) {
                    activeEl.classList.add('active');
                    const rect = activeEl.getBoundingClientRect();
                    if (rect.top < 120 || rect.bottom > window.innerHeight) {
                        activeEl.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                    }
                }
            }
        });

        // Scrubbing input
        progressBar.addEventListener('input', (e) => {
            isScrubbing = true;
            const pct = parseFloat(e.target.value);
            progressBar.style.setProperty('--progress', `${pct}%`);
            const dur = audio.duration || 2530;
            const seekTime = (pct / 100) * dur;
            currentTimeLabel.textContent = formatTime(seekTime);
        });

        progressBar.addEventListener('change', (e) => {
            const pct = parseFloat(e.target.value);
            const dur = audio.duration || 2530;
            audio.currentTime = (pct / 100) * dur;
            isScrubbing = false;
        });

        // Mute / Unmute
        muteBtn.addEventListener('click', () => {
            audio.muted = !audio.muted;
            if (audio.muted) {
                volumeIcon.style.display = 'none';
                muteIcon.style.display = 'block';
            } else {
                volumeIcon.style.display = 'block';
                muteIcon.style.display = 'none';
            }
        });

        // Playback Speed Toggle
        speedBtn.addEventListener('click', () => {
            currentSpeedIdx = (currentSpeedIdx + 1) % speeds.length;
            const speed = speeds[currentSpeedIdx];
            audio.playbackRate = speed;
            speedBtn.textContent = `${speed}x`;
        });

        function enrichData(raw) {
            return raw.map((item, idx) => {
                const s = item.start;
                const e = item.end;
                const match = labeledMoments.find(m => (s >= m.start && s <= m.end) || (e >= m.start && e <= m.end) || (s <= m.start && e >= m.end));
                return {
                    id: idx,
                    start: s,
                    end: e,
                    speaker: item.speaker || 'Teacher',
                    text: item.text,
                    tagType: match ? match.type : null,
                    tagLabel: match ? match.label : null
                };
            });
        }

        function render() {
            listEl.innerHTML = '';
            const filtered = transcriptData.filter(item => {
                if (currentFilter === 'flex' && item.tagType !== 'flex') return false;
                if (currentFilter === 'manip' && item.tagType !== 'manip') return false;

                if (searchQuery.trim() !== '') {
                    const q = searchQuery.toLowerCase();
                    const textMatch = (item.text || '').toLowerCase().includes(q) ||
                                      (item.tagLabel || '').toLowerCase().includes(q) ||
                                      (item.speaker || '').toLowerCase().includes(q);
                    if (!textMatch) return false;
                }
                return true;
            });

            if (filtered.length === 0) {
                listEl.innerHTML = `<div class="empty-state">কোনো লাইন খুঁজে পাওয়া যায়নি।</div>`;
                return;
            }

            filtered.forEach(item => {
                const row = document.createElement('div');
                let tagClass = '';
                if (item.tagType === 'flex') tagClass = 'is-flex';
                else if (item.tagType === 'manip') tagClass = 'is-manip';

                row.className = `transcript-row ${tagClass}`;
                row.id = `line-${item.id}`;
                row.setAttribute('data-start', item.start);
                row.setAttribute('data-end', item.end);

                let badgeHtml = '';
                if (item.tagType === 'flex') {
                    badgeHtml = `<span class="tag-badge tag-flex">🔥 ফ্লেক্স</span>`;
                } else if (item.tagType === 'manip') {
                    badgeHtml = `<span class="tag-badge tag-manip">🎭 ম্যানিপুলেশন</span>`;
                }

                let speakerLabel = item.speaker;
                if (item.speaker.toLowerCase() === 'teacher') speakerLabel = 'শিক্ষক';
                else if (item.speaker.toLowerCase() === 'student') speakerLabel = 'শিক্ষার্থী';

                row.innerHTML = `
                    <div class="row-meta">
                        <div style="display: flex; align-items: center; gap: 6px;">
                            <span class="timestamp">${formatTime(item.start)}</span>
                            <span class="speaker-badge ${item.speaker.toLowerCase() === 'student' ? 'speaker-student' : 'speaker-teacher'}">${speakerLabel}</span>
                        </div>
                        ${badgeHtml}
                    </div>
                    <div class="transcript-text">${item.text}</div>
                    ${item.tagLabel ? `
                        <div class="tag-title ${item.tagType === 'manip' ? 'manip-title' : ''}">
                            <span>${item.tagType === 'flex' ? '🔥' : '🎭'} ${item.tagLabel}</span>
                        </div>
                    ` : ''}
                `;

                row.addEventListener('click', () => {
                    audio.currentTime = item.start;
                    audio.play();
                });

                listEl.appendChild(row);
            });
        }

        function initTranscript(raw) {
            transcriptData = enrichData(raw);
            flexMoments = transcriptData.filter(d => d.tagType);

            document.getElementById('countAll').textContent = transcriptData.length;
            document.getElementById('countFlex').textContent = transcriptData.filter(d => d.tagType === 'flex').length;
            document.getElementById('countManip').textContent = transcriptData.filter(d => d.tagType === 'manip').length;

            render();
        }

        // 1. Instant load via transcript.js (Works on file:/// and GitHub Pages without CORS)
        if (window.fullTranscriptData && Array.isArray(window.fullTranscriptData)) {
            initTranscript(window.fullTranscriptData);
        } else {
            // 2. Fallback fetch
            fetch('./full_transcript.json')
                .then(res => res.json())
                .then(data => initTranscript(data))
                .catch(err => {
                    console.error('Error loading full_transcript.json:', err);
                });
        }

        // Filter tabs
        filterBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                filterBtns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentFilter = btn.getAttribute('data-filter');
                render();
            });
        });

        // Search input
        searchInput.addEventListener('input', (e) => {
            searchQuery = e.target.value;
            render();
        });

        // Quick Jump to Prev / Next Flex or Control Moment
        function jumpFlex(dir) {
            const curr = audio.currentTime;
            let target = null;
            if (dir === 'next') {
                target = flexMoments.find(f => f.start > curr + 1);
                if (!target && flexMoments.length > 0) target = flexMoments[0];
            } else {
                const prevs = flexMoments.filter(f => f.start < curr - 1);
                target = prevs[prevs.length - 1];
                if (!target && flexMoments.length > 0) target = flexMoments[flexMoments.length - 1];
            }
            if (target) {
                audio.currentTime = target.start;
                audio.play();
            }
        }

        prevFlexBtn.addEventListener('click', () => jumpFlex('prev'));
        nextFlexBtn.addEventListener('click', () => jumpFlex('next'));
    </script>
</body>

</html>
